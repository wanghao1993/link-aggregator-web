<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .logo { width: 24px; height: 24px; background: linear-gradient(135deg, #0d9488, #14b8a6); border-radius: 6px; }
    h1 { font-size: 16px; font-weight: 600; }
    .form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 12px; font-weight: 500; color: #666; }
    input, select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #0d9488; }
    button { width: 100%; padding: 10px; background: #0d9488; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; }
    button:hover { background: #0f766e; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .loading { text-align: center; padding: 20px; color: #666; }
    .error { color: #dc2626; font-size: 12px; }
    .success { color: #16a34a; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"></div>
    <h1>Save to Link</h1>
  </div>
  
  <div id="content">
    <div class="loading">Loading...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
